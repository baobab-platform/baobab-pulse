name: Security — Python (Bandit + pip-audit)

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "bandit.yaml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "bandit.yaml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    # Pin is baobab-platform/shared's v1.2.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.2.0`.
    uses: baobab-platform/shared/.github/workflows/security-python.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    with:
      bandit-config-path: "bandit.yaml"
      bandit-target: "src"
      dependency-group: "security"
