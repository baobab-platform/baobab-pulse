# Do NOT add a checkout step to the `greet` job below. This workflow uses
# pull_request_target specifically so the bot can comment using the base
# repository's token even on PRs from forks — safe only as long as the PR's
# own code is never checked out or executed here.

name: Greet First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  greet:
    permissions:
      issues: write
      pull-requests: write
    # Pin is baobab-platform/shared's v1.2.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.2.0`.
    uses: baobab-platform/shared/.github/workflows/greetings.yml@38defb11aacd95a6f68b7db8026fe336417a2af6 # v1.2.0
    with:
      issue-message: "Thanks for opening your first issue here — a maintainer will take a look shortly."
      pr-message: "Thanks for your first pull request here — a maintainer will review it shortly."
