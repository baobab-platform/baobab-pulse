name: Staging Tagged Image

on:
  push:
    tags: ['v*.*.*-staging']

permissions:
  contents: read

concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-quality:
    name: Verify exact source quality
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged source on main with successful Pulse CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --status success \
            --json headSha,conclusion > pulse-ci.json

          python - <<'CHECK'
          import json
          import os

          with open("pulse-ci.json", encoding="utf-8") as handle:
              runs = json.load(handle)

          if not any(
              run["headSha"] == os.environ["GITHUB_SHA"]
              and run["conclusion"] == "success"
              for run in runs
          ):
              raise SystemExit(
                  "Tagged source requires successful Pulse CI on the exact main commit"
              )
          CHECK

  publish:
    name: Publish verified staging image
    needs: source-quality
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    uses: baobab-platform/shared/.github/workflows/reusable-staging-image.yml@eb5449b4abf7a02f3b3e34b1572f456647ba3a6e
    with:
      dockerfile: Dockerfile
      image: ghcr.io/baobab-platform/baobab-pulse
      go-tests: false
      artifact-suffix: pulse
