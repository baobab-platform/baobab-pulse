name: Enforce Dependabot Config

on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    # Pin is baobab-platform/shared's v1.2.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.2.0`.
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    with:
      required-ecosystems: "github-actions,uv,docker"
