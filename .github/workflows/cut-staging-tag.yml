name: Cut Staging Tag

on:
  push:
    branches:
      - 'release/v*.*.*-staging'

permissions:
  contents: write
  actions: write

concurrency:
  group: staging-tag-cut-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cut:
    name: Verify source and cut staging tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release branch, package version and exact green main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" =~ ^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging$ ]]
          tag="${GITHUB_REF_NAME#release/}"
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          [[ "$tag" == "v${version}-staging" ]]

          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --status success \
            --json headSha,conclusion > pulse-ci.json

          python - <<'PY'
          import json, os
          runs = json.load(open("pulse-ci.json", encoding="utf-8"))
          if not any(
              run["headSha"] == os.environ["GITHUB_SHA"]
              and run["conclusion"] == "success"
              for run in runs
          ):
              raise SystemExit("release source requires successful Pulse CI on the exact main commit")
          PY

          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Create or verify immutable staging tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            python - "$GITHUB_SHA" <<'PY' <<<"$ref_json"
          import json, sys
          expected = sys.argv[1]
          value = json.load(sys.stdin)
          obj = value["object"]
          if obj["type"] != "commit" or obj["sha"] != expected:
              raise SystemExit("existing staging tag is not the exact requested immutable commit")
          PY
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Dispatch staging publisher at immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run staging-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$tag"
