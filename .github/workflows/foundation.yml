name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    # v1.2.0 predates the Foundation Gates profile/floor-comparison fixes
    # (infra + frontend-e2e profiles, Gem::Version floor check, prerelease
    # suffix normalization) and was failing this repo's own minimum_version
    # check outright. No tag covers the fixed commit yet, so pinning to the
    # commit SHA directly; verified live via
    # `git ls-remote https://github.com/nabhold/shared.git main`.
    uses: nabhold/shared/.github/workflows/foundation-repository-gates.yml@798a16822f5ea46c826fafc689a64303d32ba3e4
    with:
      dockerfile: "Dockerfile"
      build_context: "."
