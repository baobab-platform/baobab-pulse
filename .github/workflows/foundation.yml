name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@7d5b89ccd67bca54ebe65677f390e964f6d3e07e
    with:
      foundation_ref: "7d5b89ccd67bca54ebe65677f390e964f6d3e07e"
      dependency_review_enabled: false
