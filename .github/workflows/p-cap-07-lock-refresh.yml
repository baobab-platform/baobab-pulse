name: P-CAP-07 Lock Refresh

on:
  push:
    branches:
      - feat/p-cap-07-provider-readiness

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p-cap-07-provider-readiness
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.0"
          python-version: "3.14"
      - name: Resolve lockfile
        run: uv lock
      - name: Commit resolved lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(p-cap-07): refresh uv lock"
          git push origin HEAD:feat/p-cap-07-provider-readiness
