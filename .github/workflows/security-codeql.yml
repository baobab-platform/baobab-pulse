name: Security — CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    # Pin is baobab-platform/shared's v1.2.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.2.0`.
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@38defb11aacd95a6f68b7db8026fe336417a2af6 # v1.2.0
    with:
      languages: '["python"]'
