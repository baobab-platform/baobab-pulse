# .baobab/capability-provider.yaml
#
# Pulse capability-provider declaration following ADR-SHARED-029.
#
# IMPORTANT:
# - Shared owns canonical capability vocabulary.
# - This census adoption declares only CONTRACTED intent.
# - No providers[].support entry exists yet.
# - Certification, runtime activation, bindings, grants and resolution remain
#   separate EA-09 / Control Plane concerns.

schema:
  name: baobab-capability-provider-declaration
  version: "1.0"

engine:
  engine_id: baobab-pulse

planned_capabilities:
  - capability_key: intelligence.evidence.search
    proposal_status: CONTRACTED
    description: >-
      Adopt the Shared v1 intelligence evidence-search contract. P-CAP-03 now
      provides the authenticated, caller-bound canonical adapter: tenant
      authority comes from validated Control Plane context and caller-selected
      clearance is rejected. Provider support remains intentionally undeclared
      until the later P-CAP promotion decision and certification sequence.
    provenance:
      authority:
        repository: baobab-platform/shared
        decision: ADR-SHARED-029
      source_revision: 2d14087727682d454f7140ba65aa97625454991b

  - capability_key: intelligence.research-mission.manage
    proposal_status: CONTRACTED
    description: >-
      Adopt the Shared v1 research-mission management contract. P-CAP-04 provides
      authenticated, caller-bound durable CREATE/GET. P-CAP-05 adds atomic
      idempotency, mutation audit provenance and a HELD_UNREGISTERED transactional
      outbox candidate for CREATE. Provider support remains intentionally
      undeclared until the P-CAP-06 evidence-backed promotion decision.
    provenance:
      authority:
        repository: baobab-platform/shared
        decision: ADR-SHARED-029
      source_revision: 2d14087727682d454f7140ba65aa97625454991b
