# The baobab-platform/shared contracts this engine consumes (EA Plan v2.0
# EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# tests/fixtures/contracts holds byte-for-byte copies of these files at the
# pinned commit; tests/contract validates Pulse's envelope and problem
# models against them. Foundation checks the pin and reports drift.
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: 6e0267572edb533ce781b2a7fc6863918ca2d62e
contracts:
  - contracts/control-plane/v1/domain.schema.json
  - contracts/cross-engine-reference/v1/domain.schema.json
  - contracts/errors/v1/problem-details.schema.json
  - contracts/events/v1/envelope.schema.json
  - contracts/regulatory-document-exchange/v1/domain.schema.json
  - contracts/regulatory-document-exchange/v1/events.schema.json
  - contracts/trade-document/v2/domain.schema.json
  - contracts/trade-document/v2/events.schema.json
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
# Repository-specific invariants, carried over from the legacy lock.
consumer:
  repository: baobab-platform/baobab-pulse
consumer_policy:
  fail_on_unresolved_tenant_context: true
  allow_cross_engine_database_access: false
  allow_local_redefinition_as_canonical: false
